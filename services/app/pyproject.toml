[project]
name = "foms"
version = "0.1.0"
description = "Filament and Order Management System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
