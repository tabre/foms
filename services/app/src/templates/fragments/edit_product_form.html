{% import "macros.html" as macros %}
<tr class="row" id="row-p-{{ p.id }}">
    <td colspan="4">
        <form class="inline-form" method="post" action="/products/{{ p.id }}" hx-post="/products/{{ p.id }}" hx-target="#row-p-{{ p.id }}" hx-swap="outerHTML">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <label for="ename-{{ p.id }}">Name</label>
            <input id="ename-{{ p.id }}" name="name" maxlength="80" value="{{ p.name }}" required/>
            {{ macros.combobox("Default filament", "filament_id", "/options/filaments?style=table", value=p.default_filament_id, required=True) }}
            <label for="ewp-{{ p.id }}">Weight per unit (g)</label>
            <input id="ewp-{{ p.id }}" name="weight" type="number" step="0.1" min="0.1" value="{{ p.weight_per_unit_g }}" required/>
            <label for="epthr-{{ p.id }}">Threshold (units)</label>
            <input id="epthr-{{ p.id }}" name="threshold" type="number" min="0" step="1" value="{{ p.low_stock_threshold }}"/>
            <button type="submit" class="primary">Save</button>
            {% if error %}<div class="field-error" role="alert">{{ error }}</div>{% endif %}
        </form>
    </td>
</tr>
