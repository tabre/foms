services:
  app:
    build:
      context: ./services/app
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    restart: unless-stopped
    volumes:
      - ./services/app:/home/appuser/foms
    environment:
      UV_CACHE_DIR: /home/appuser/foms/.uv-cache
      FLASK_RUN_HOST: 0.0.0.0
      PG_IP: ${PG_IP}
      PG_PORT: ${PG_PORT}
      PG_DB: ${PG_DB}
      PG_UN: ${PG_UN}
      PG_PW: ${PG_PW}
    networks:
      v0:
        ipv4_address: ${FOMS_IP}
    ports:
      - "${FOMS_PORT}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    command: >
      bash -c "
      ./init.sh &&
      exec uv run flask --app src/server run --debug
      "

  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_UN}
      POSTGRES_PASSWORD: ${PG_PW}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./services/postgres/pginit.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      v0:
        ipv4_address: ${PG_IP}
    ports:
      - "${PG_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_UN} -d ${PG_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

networks:
  v0:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET}/24
